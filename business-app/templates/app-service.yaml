apiVersion: v1
kind: Service

metadata:
  name: {{ include "business-app.fullname" . }}

  labels:
    {{- include "business-app.appLabels" . | nindent 4 }}

spec:
  type: {{ .Values.app.service.type }}

  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP

  selector:
    {{- include "business-app.appSelectorLabels" . | nindent 4 }}
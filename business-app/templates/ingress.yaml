{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "business-app.fullname" . }}

  labels:
    {{- include "business-app.appLabels" . | nindent 4 }}

  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:

  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}

  rules:

    {{- range .Values.ingress.hosts }}

    - host: {{ .host | quote }}

      http:
        paths:

          {{- range .paths }}

          - path: {{ .path | quote }}
            pathType: {{ .pathType }}

            backend:
              service:
                name: {{ include "business-app.fullname" $ }}

                port:
                  number: {{ $.Values.app.service.port }}

          {{- end }}

    {{- end }}

  {{- with .Values.ingress.tls }}

  tls:
    {{- toYaml . | nindent 4 }}

  {{- end }}

{{- end }}